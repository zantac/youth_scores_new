name: CI

# Gate every PR (and pushes to the main branches) on the checks that would
# otherwise only ever run locally. The deploy flow is manual (fork → upstream →
# Railway redeploy), so this is the only automated safety net before prod.
on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
        working-directory: backend
      - name: Run tests
        run: python -m pytest -q
        working-directory: backend
        env:
          PYTHONPATH: .

  web:
    name: Web (build)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [web, web-tla3bny]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: ${{ matrix.app }}
      # Type-check only: neither app has an ESLint config, so `next lint` would
      # fail non-interactively. tsc --noEmit is the real correctness gate here.
      - name: Type-check
        run: npx tsc --noEmit
        working-directory: ${{ matrix.app }}
      # Run the actual export build — this is what deploys, and it catches breaks
      # tsc can't (e.g. a Next major flipping to Turbopack, a Tailwind v4 config
      # change, or a next-pwa/webpack incompatibility from a dependency bump).
      - name: Build
        run: npm run build
        working-directory: ${{ matrix.app }}

  flutter:
    name: Flutter (analyze)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          # Pinned (not bare "stable") so a future stable release can't introduce
          # new lints mid-review now that analyze is strict. Bump deliberately.
          flutter-version: 3.47.2
          channel: stable
      - run: flutter pub get
      # Fully strict now that the lint debt is cleared: analyze fails on any
      # info/warning/error, so new deprecations or style regressions can't creep in.
      - run: flutter analyze
