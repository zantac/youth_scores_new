name: Deploy Website

on:
  push:
    branches: [master, main]
    paths:
      - 'web/**'

  workflow_dispatch:

# Serialize deploys: several PRs merged within seconds each triggered a run, and
# the overlapping force-pushes to gh-pages raced — one failed with "failed to
# push some refs". Queue them (don't cancel) so each completes in order and the
# last reflects the newest commit.
concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Build
        run: npm run build
        working-directory: web

      - name: Add .nojekyll
        run: touch web/out/.nojekyll

      - name: Add CNAME
        run: echo "youthscores.org" > web/out/CNAME

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: web/out
          force_orphan: true
