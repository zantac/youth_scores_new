# Keeps dependencies (and the digest-pinned base images, which don't auto-patch)
# from silently rotting. Minor+patch are grouped weekly to keep noise low.
# MAJOR bumps are deliberately NOT grouped — they arrive as individual PRs so a
# breaking major (e.g. Next 15->16, Tailwind 3->4, TS 5->7) can't ride in
# unnoticed inside a batch. The CI `npm run build` step is the backstop that
# fails such a PR before it can be merged.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /web-tla3bny
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
